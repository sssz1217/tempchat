<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>临时群聊 - 纯P2P版本</title>
    <!-- Tailwind CSS v3 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- PeerJS for WebRTC -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        dark: '#1F2937',
                        light: '#F3F4F6',
                        accent: '#8B5CF6'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: system-ui, sans-serif;
        }
        .message-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            margin-bottom: 10px;
        }
        .message-self {
            background-color: #3B82F6;
            color: white;
            border-bottom-right-radius: 4px;
            margin-left: auto;
        }
        .message-other {
            background-color: #E5E7EB;
            color: #1F2937;
            border-bottom-left-radius: 4px;
            margin-right: auto;
        }
        /* 多人视频网格布局（核心：显示所有人） */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 12px;
            padding: 16px;
            height: calc(100vh - 120px);
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
        }
        .video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-name {
            position: absolute;
            bottom: 8px;
            left: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        /* 视频控制按钮 */
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body class="font-sans">

<!-- 主容器 -->
<div id="app" class="max-w-md mx-auto h-screen bg-white shadow-lg overflow-hidden flex flex-col">
    <!-- 登录页面 -->
    <div id="login-screen" class="flex-1 flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-xs text-center">
            <div class="fa fa-comments text-4xl text-primary mb-4"></div>
            <h1 class="text-3xl font-bold mb-6">临时群聊</h1>
            <input id="username" placeholder="输入你的昵称" class="w-full px-4 py-3 border rounded-lg mb-3">
            <input id="room-id" placeholder="输入4位房间号" maxlength="4" class="w-full px-4 py-3 border rounded-lg mb-4">
            <button onclick="joinRoom()" class="w-full bg-primary text-white py-3 rounded-lg">进入房间</button>
        </div>
    </div>

    <!-- 聊天页面 -->
    <div id="chat-screen" class="flex-1 flex flex-col hidden">
        <!-- 顶部栏 -->
        <header class="bg-white border-b px-4 py-3 flex justify-between items-center">
            <div>
                <h3 class="font-bold">房间：<span id="room-text"></span></h3>
                <p class="text-xs text-gray-500">在线：<span id="online-count">1</span> 人</p>
            </div>
            <button id="join-call-btn" class="bg-secondary text-white px-3 py-2 rounded-lg text-sm hidden">参与视频</button>
            <button onclick="openCallSelect()" class="bg-secondary text-white px-3 py-2 rounded-lg">
                <i class="fa fa-video-camera mr-1"></i>发起视频
            </button>
        </header>

        <!-- 消息区域 -->
        <div id="messages" class="flex-1 overflow-y-auto p-4 bg-gray-50"></div>

        <!-- 输入框 -->
        <footer class="p-3 border-t flex gap-2">
            <input id="msg-input" placeholder="输入消息..." class="flex-1 px-4 py-2 border rounded-full">
            <button onclick="sendMessage()" class="bg-primary text-white px-4 py-2 rounded-full">
                <i class="fa fa-paper-plane"></i>
            </button>
        </footer>
    </div>

    <!-- 视频通话页面（多人网格 + 完整控制） -->
    <div id="video-screen" class="fixed inset-0 bg-dark z-50 hidden">
        <!-- 视频网格（显示所有人） -->
        <div id="video-grid" class="video-grid"></div>

        <!-- 视频控制栏 -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-4">
            <button id="mic-btn" onclick="toggleMic()" class="control-btn bg-gray-700">
                <i class="fa fa-microphone"></i>
            </button>
            <button id="camera-btn" onclick="toggleCamera()" class="control-btn bg-gray-700">
                <i class="fa fa-video-camera"></i>
            </button>
            <button onclick="hangUp()" class="control-btn bg-red-600">
                <i class="fa fa-phone"></i>
            </button>
        </div>
    </div>

    <!-- 选择通话人员弹窗 -->
    <div id="call-modal" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-40">
        <div class="bg-white p-5 rounded-lg w-80">
            <h3 class="font-bold mb-3">选择通话成员</h3>
            <div id="member-list" class="max-h-60 overflow-y-auto mb-4"></div>
            <div class="flex gap-2">
                <button onclick="startSelectedCall()" class="flex-1 bg-primary text-white py-2 rounded-lg">发起呼叫</button>
                <button onclick="closeCallModal()" class="flex-1 bg-gray-300 py-2 rounded-lg">取消</button>
            </div>
        </div>
    </div>

    <!-- 接听弹窗 -->
    <div id="answer-modal" class="fixed inset-0 bg-black/50 hidden justify-center items-center z-40">
        <div class="bg-white p-5 rounded-lg text-center">
            <h3 class="font-bold mb-4" id="caller-info">邀请你视频通话</h3>
            <div class="flex gap-4 justify-center">
                <button onclick="acceptCall()" class="bg-green-500 text-white px-6 py-2 rounded-lg">接受</button>
                <button onclick="rejectCall()" class="bg-red-500 text-white px-6 py-2 rounded-lg">拒绝</button>
            </div>
        </div>
    </div>
</div>

<script>
// 全局变量
let peer;
let username = "";
let roomId = "";
let connections = {};
let localStream = null;
let callMap = {}; // 存储所有通话
let inCall = false;
let micOn = true;
let cameraOn = true;
// 历史消息（永久保存）
let chatHistory = JSON.parse(localStorage.getItem('p2p_chat_history')) || [];

// 加入房间
function joinRoom() {
    username = document.getElementById('username').value.trim();
    roomId = document.getElementById('room-id').value.trim();
    
    if (!username || !roomId || roomId.length !==4) {
        alert('请输入昵称和4位房间号');
        return;
    }

    // 初始化Peer
    peer = new Peer({
        config: { iceServers: [{ urls: 'stun:stun.cloudflare.com' }] }
    });

    peer.on('open', (id) => {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('chat-screen').classList.remove('hidden');
        document.getElementById('room-text').innerText = roomId;
        
        // 加载历史消息
        loadHistory();
    });

    // 监听连接
    peer.on('connection', (conn) => handleConnection(conn));
    // 监听来电
    peer.on('call', (call) => handleIncomingCall(call));
}

// 处理连接
function handleConnection(conn) {
    conn.on('open', () => {
        conn.send({ type: 'join', name: username });
    });

    conn.on('data', (data) => {
        switch(data.type) {
            case 'join':
                connections[conn.peer] = { conn, name: data.name };
                updateOnline();
                addSystemMsg(`${data.name} 加入群聊`);
                // 同步历史
                conn.send({ type: 'history', list: chatHistory });
                break;
            case 'msg':
                addMessage(data.name, data.text, false);
                break;
            case 'history':
                chatHistory = data.list;
                localStorage.setItem('p2p_chat_history', JSON.stringify(chatHistory));
                loadHistory();
                break;
        }
    });
}

// 发送消息
function sendMessage() {
    const text = document.getElementById('msg-input').value.trim();
    if (!text) return;
    
    addMessage(username, text, true);
    document.getElementById('msg-input').value = '';

    Object.values(connections).forEach(item => {
        item.conn.send({ type: 'msg', name: username, text });
    });
}

// 添加消息
function addMessage(name, text, isMe) {
    const div = document.createElement('div');
    div.className = `message-bubble ${isMe ? 'message-self' : 'message-other'}`;
    div.innerHTML = isMe ? text : `<div class="text-xs mb-1">${name}</div>${text}`;
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = 9999;

    // 保存历史
    chatHistory.push({ name, text, isMe });
    localStorage.setItem('p2p_chat_history', JSON.stringify(chatHistory));
}

// 加载历史
function loadHistory() {
    document.getElementById('messages').innerHTML = '';
    chatHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = `message-bubble ${item.isMe ? 'message-self' : 'message-other'}`;
        div.innerHTML = item.isMe ? item.text : `<div class="text-xs mb-1">${item.name}</div>${item.text}`;
        document.getElementById('messages').appendChild(div);
    });
}

// --------------------------
// 视频通话核心功能
// --------------------------
// 打开选择成员弹窗
function openCallSelect() {
    const list = document.getElementById('member-list');
    list.innerHTML = '';
    Object.values(connections).forEach(item => {
        list.innerHTML += `
            <div class="p-2 border-b">
                <input type="checkbox" id="${item.conn.peer}" value="${item.conn.peer}">
                <label for="${item.conn.peer}">${item.name}</label>
            </div>
        `;
    });
    document.getElementById('call-modal').classList.remove('hidden');
    document.getElementById('call-modal').classList.add('flex');
}

// 发起选中的通话
function startSelectedCall() {
    const checked = document.querySelectorAll('#member-list input:checked');
    if (checked.length === 0) { alert('请选择成员'); return; }
    closeCallModal();

    // 获取媒体流
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localStream = stream;
            inCall = true;
            showVideoUI();
            addVideoStream(peer.id, username, stream, true);

            // 呼叫选中成员
            checked.forEach(box => {
                const call = peer.call(box.value, stream);
                callMap[box.value] = call;
                handleCallStream(call);
            });
        });
}

// 处理来电
function handleIncomingCall(call) {
    const callerId = call.peer;
    const callerName = connections[callerId]?.name || '陌生人';
    document.getElementById('caller-info').innerText = `${callerName} 邀请你视频通话`;
    document.getElementById('answer-modal').classList.remove('hidden');
    document.getElementById('answer-modal').classList.add('flex');
    window.currentCall = call;
}

// 接受通话
function acceptCall() {
    document.getElementById('answer-modal').classList.add('hidden');
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localStream = stream;
            inCall = true;
            showVideoUI();
            addVideoStream(peer.id, username, stream, true);
            
            const call = window.currentCall;
            call.answer(stream);
            callMap[call.peer] = call;
            handleCallStream(call);
        });
}

// 拒绝通话
function rejectCall() {
    document.getElementById('answer-modal').classList.add('hidden');
}

// 处理视频流
function handleCallStream(call) {
    call.on('stream', (remoteStream) => {
        const name = connections[call.peer]?.name || '用户';
        addVideoStream(call.peer, name, remoteStream, false);
    });
}

// 主动加入视频通话
document.getElementById('join-call-btn').onclick = () => {
    if (inCall) return;
    navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
            localStream = stream;
            inCall = true;
            showVideoUI();
            addVideoStream(peer.id, username, stream, true);
            
            Object.values(connections).forEach(item => {
                const call = peer.call(item.conn.peer, stream);
                callMap[item.conn.peer] = call;
                handleCallStream(call);
            });
        });
};

// 添加视频画面（多人网格）
function addVideoStream(id, name, stream, isLocal) {
    // 避免重复添加
    if (document.getElementById(`video-${id}`)) return;

    const wrapper = document.createElement('div');
    wrapper.className = 'video-wrapper';
    wrapper.id = `video-${id}`;

    const video = document.createElement('video');
    video.className = 'video-element';
    video.autoplay = true;
    video.playsInline = true;
    video.muted = isLocal; // 本地视频静音
    video.srcObject = stream;

    const nameTag = document.createElement('div');
    nameTag.className = 'video-name';
    nameTag.innerText = isLocal ? `${name} (我)` : name;

    wrapper.appendChild(video);
    wrapper.appendChild(nameTag);
    document.getElementById('video-grid').appendChild(wrapper);
}

// 视频控制：开关麦克风
function toggleMic() {
    micOn = !micOn;
    localStream.getAudioTracks()[0].enabled = micOn;
    document.getElementById('mic-btn').innerHTML = micOn 
        ? '<i class="fa fa-microphone"></i>' 
        : '<i class="fa fa-microphone-slash"></i>';
}

// 视频控制：开关摄像头
function toggleCamera() {
    cameraOn = !cameraOn;
    localStream.getVideoTracks()[0].enabled = cameraOn;
    document.getElementById('camera-btn').innerHTML = cameraOn 
        ? '<i class="fa fa-video-camera"></i>' 
        : '<i class="fa fa-video-camera-slash"></i>';
}

// 挂断通话
function hangUp() {
    // 停止所有流
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    // 关闭所有通话
    Object.values(callMap).forEach(call => call.close());
    callMap = {};
    inCall = false;
    micOn = true;
    cameraOn = true;

    // 重置UI
    document.getElementById('video-screen').classList.add('hidden');
    document.getElementById('join-call-btn').classList.add('hidden');
    document.getElementById('video-grid').innerHTML = '';
    document.getElementById('mic-btn').innerHTML = '<i class="fa fa-microphone"></i>';
    document.getElementById('camera-btn').innerHTML = '<i class="fa fa-video-camera"></i>';
}

// --------------------------
// 工具函数
// --------------------------
function showVideoUI() {
    document.getElementById('video-screen').classList.remove('hidden');
    document.getElementById('join-call-btn').classList.add('hidden');
}

function closeCallModal() {
    document.getElementById('call-modal').classList.add('hidden');
}

function updateOnline() {
    document.getElementById('online-count').innerText = Object.keys(connections).length + 1;
}

function addSystemMsg(text) {
    const div = document.createElement('div');
    div.className = 'text-center text-xs text-gray-500 my-2';
    div.innerText = text;
    document.getElementById('messages').appendChild(div);
}
</script>
</body>
</html>
