<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P群聊</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: Arial, sans-serif;}
        body {background: #f5f5f5;max-width: 500px;margin: 0 auto;}
        .container {height: 100vh;display: flex;flex-direction: column;background: white;}
        .header {padding: 15px;background: #3B82F6;color: white;display: flex;justify-content: space-between;align-items: center;}
        .video-join-btn {background: #10B981;color: white;border: none;padding: 6px 10px;border-radius: 6px;display: none;}
        /* 你原始的登录界面样式 👇 */
        .login {padding: 20px;text-align: center;}
        .login input {width: 100%;padding: 12px;margin: 10px 0;border: 1px solid #ddd;border-radius: 8px;}
        .login button {width: 100%;padding: 12px;background: #3B82F6;color: white;border: none;border-radius: 8px;}
        /* 聊天样式 */
        .chat {flex: 1;overflow-y: auto;padding: 15px;display: none;background: #f9f9f9;}
        .message {margin-bottom: 10px;max-width: 70%;padding: 10px;border-radius: 10px;}
        .me {background: #3B82F6;color: white;margin-left: auto;}
        .other {background: #e5e5ea;color: black;margin-right: auto;}
        .system {text-align: center;color: #666;font-size: 12px;margin: 5px 0;}
        .footer {display: none;padding: 10px;border-top: 1px solid #ddd;display: flex;gap:10px}
        .footer input {flex: 1;padding: 12px;border: 1px solid #ddd;border-radius: 20px;}
        .footer button {padding: 12px 15px;background: #3B82F6;color: white;border: none;border-radius: 50%;}
        /* 弹窗样式 */
        .popup {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0,0,0,0.5);display: none;justify-content: center;align-items: center;z-index: 999;}
        .popup-content {background: white;padding: 20px;border-radius: 10px;width: 90%;max-width: 300px;}
        .user-item {padding: 8px;margin: 5px 0;border-bottom:1px solid #eee;}
        .popup button {margin-top: 15px;width: 100%;padding: 10px;background: #3B82F6;color: white;border: none;border-radius: 8px;}
        .call-btn {background: #10B981;color: white;border: none;padding: 8px;border-radius: 6px;}
        .answer-btn {padding: 8px 15px;margin: 5px;border: none;border-radius: 6px;}
        /* 多人视频通话界面（核心） */
        .videos {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: #000;display: none;z-index: 9999;}
        /* 视频网格 - 显示所有人 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 8px;
            padding: 8px;
            height: calc(100vh - 80px);
        }
        .video-wrapper {
            position: relative;
            background: #111;
            border-radius: 8px;
            overflow: hidden;
        }
        .video-element {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-name {
            position: absolute;
            bottom: 4px;
            left: 4px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
        /* 视频控制按钮 */
        .control-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bg-gray {background: #444;}
        .bg-red {background: red;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h3>P2P群聊</h3>
                <p id="peer-id">你的ID：加载中...</p>
            </div>
            <button class="video-join-btn" id="join-video-btn">参与视频通话</button>
            <button class="call-btn" id="call-btn" style="display:none;"><i class="fa fa-video-camera"></i></button>
        </div>

        <!-- 你原始的登录界面 👇 完全还原 -->
        <div class="login" id="login">
            <input id="username" placeholder="输入你的昵称">
            <input id="remote-id" placeholder="输入对方ID（可留空）">
            <button onclick="login()">进入聊天</button>
        </div>

        <div class="chat" id="chat"></div>

        <div class="footer" id="footer">
            <input id="msg" placeholder="输入消息...">
            <button onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 多人视频通话界面 -->
    <div class="videos" id="videos">
        <div id="video-grid" class="video-grid"></div>
        <!-- 视频控制栏：开麦/摄像头/挂断 -->
        <div class="control-bar">
            <button id="mic-btn" class="control-btn bg-gray" onclick="toggleMic()">
                <i class="fa fa-microphone"></i>
            </button>
            <button id="camera-btn" class="control-btn bg-gray" onclick="toggleCamera()">
                <i class="fa fa-video-camera"></i>
            </button>
            <button class="control-btn bg-red" onclick="hangup()">
                <i class="fa fa-phone"></i>
            </button>
        </div>
    </div>

    <!-- 选择呼叫人员弹窗 -->
    <div class="popup" id="call-popup">
        <div class="popup-content">
            <h3>选择要呼叫的人</h3>
            <div id="user-list"></div>
            <button onclick="startSelectedCall()">发起呼叫</button>
            <button onclick="closePopup()" style="background:#666;margin-top:5px;">取消</button>
        </div>
    </div>

    <!-- 来电接听弹窗 -->
    <div class="popup" id="answer-popup">
        <div class="popup-content">
            <h3 id="caller-name">有人邀请你视频通话</h3>
            <button class="answer-btn" style="background:green" onclick="answerCall()">接受</button>
            <button class="answer-btn" style="background:red" onclick="closeAnswer()">拒绝</button>
        </div>
    </div>

    <script>
        // 核心配置
        let peer;
        let myId;
        let username;
        let connList = {};
        let localStream = null;
        let callMap = {}; // 存储所有通话
        let inCall = false;
        let micOn = true;
        let cameraOn = true;

        // 历史消息永久存储
        let messageHistory = JSON.parse(localStorage.getItem("p2p_chat_history")) || [];

        // 初始化
        window.onload = init();

        function init() {
            loadHistory();
            peer = new Peer({
                config: { iceServers: [{ urls: 'stun:stun.cloudflare.com' }] }
            });

            peer.on("open", id => {
                myId = id;
                document.getElementById("peer-id").innerText = "你的ID：" + id;
            });

            peer.on("connection", conn => handleNewConn(conn));
            peer.on("call", call => handleIncomingCall(call));
        }

        // 原始登录逻辑
        function login() {
            username = document.getElementById("username").value.trim();
            let remoteId = document.getElementById("remote-id").value.trim();
            if (!username) return alert("请输入昵称");

            document.getElementById("login").style.display = "none";
            document.getElementById("chat").style.display = "block";
            document.getElementById("footer").style.display = "flex";
            document.getElementById("call-btn").style.display = "block";

            if (remoteId) {
                let conn = peer.connect(remoteId);
                handleNewConn(conn);
            }
        }

        // 处理连接
        function handleNewConn(conn) {
            conn.on("open", () => {
                connList[conn.peer] = { conn, name: "" };
                conn.send({ type: "info", name: username });
                conn.send({ type: "history", list: messageHistory });
            });

            conn.on("data", data => {
                if (data.type === "info") {
                    connList[conn.peer].name = data.name;
                    addSysMsg(data.name + " 加入群聊");
                }
                if (data.type === "msg") addMsg(data.name, data.text, false);
                if (data.type === "history") {
                    messageHistory = data.list;
                    localStorage.setItem("p2p_chat_history", JSON.stringify(messageHistory));
                    loadHistory();
                }
            });
        }

        // 发送消
        function sendMsg() {
            let text = document.getElementById("msg").value.trim();
            if (!text) return;
            addMsg(username, text, true);
            document.getElementById("msg").value = "";
            Object.values(connList).forEach(item => {
                item.conn.send({ type: "msg", name: username, text });
            });
        }

        // 消息+历史
        function addMsg(name, text, isMe) {
            let div = document.createElement("div");
            div.className = "message " + (isMe ? "me" : "other");
            div.innerText = (isMe ? "" : name + "：") + text;
            document.getElementById("chat").appendChild(div);
            document.getElementById("chat").scrollTop = 9999;
            messageHistory.push({ name, text, isMe });
            localStorage.setItem("p2p_chat_history", JSON.stringify(messageHistory));
        }

        function addSysMsg(text) {
            let div = document.createElement("div");
            div.className = "system";
            div.innerText = text;
            document.getElementById("chat").appendChild(div);
        }

        function loadHistory() {
            document.getElementById("chat").innerHTML = "";
            messageHistory.forEach(item => {
                let div = document.createElement("div");
                div.className = "message " + (item.isMe ? "me" : "other");
                div.innerText = (item.isMe ? "" : item.name + "：") + item.text;
                document.getElementById("chat").appendChild(div);
            });
        }

        // --------------------------
        // 视频通话（全部满足要求）
        // --------------------------
        // 打开勾选人员弹窗
        document.getElementById("call-btn").onclick = () => {
            let list = document.getElementById("user-list");
            list.innerHTML = "";
            Object.values(connList).forEach(item => {
                if (item.name) list.innerHTML += `<div class="user-item"><input type="checkbox" id="${item.conn.peer}" value="${item.conn.peer}"> ${item.name}</div>`;
            });
            document.getElementById("call-popup").style.display = "flex";
        };

        // 发起勾选人员通话
        function startSelectedCall() {
            let checkboxes = document.querySelectorAll("#user-list input:checked");
            if (checkboxes.length === 0) { alert("请选择人员"); return; }
            closePopup();

            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                inCall = true;
                startVideoUI();
                addVideoStream(myId, username, stream, true);

                // 呼叫选中成员
                checkboxes.forEach(box => {
                    let call = peer.call(box.value, stream);
                    callMap[box.value] = call;
                    listenCallStream(call);
                });
            });
        }

        // 处理来电
        function handleIncomingCall(call) {
            document.getElementById("caller-name").innerText = connList[call.peer]?.name + " 邀请你视频通话";
            document.getElementById("answer-popup").style.display = "flex";
            window.currentCall = call;
        }

        // 接受通话
        function answerCall() {
            document.getElementById("answer-popup").style.display = "none";
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                inCall = true;
                startVideoUI();
                addVideoStream(myId, username, stream, true);
                
                let call = window.currentCall;
                call.answer(stream);
                callMap[call.peer] = call;
                listenCallStream(call);
            });
        }

        // 主动加入视频
        document.getElementById("join-video-btn").onclick = () => {
            if(inCall) return;
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                inCall = true;
                startVideoUI();
                addVideoStream(myId, username, stream, true);
                
                Object.values(connList).forEach(item => {
                    let call = peer.call(item.conn.peer, stream);
                    callMap[item.conn.peer] = call;
                    listenCallStream(call);
                });
            });
        };

        // 监听远程视频流
        function listenCallStream(call) {
            call.on("stream", remoteStream => {
                let name = connList[call.peer]?.name || "用户";
                addVideoStream(call.peer, name, remoteStream, false);
            });
        }

        // 添加视频画面（多人网格）
        function addVideoStream(id, name, stream, isLocal) {
            if (document.getElementById(`vid-${id}`)) return;
            
            let wrap = document.createElement("div");
            wrap.className = "video-wrapper";
            wrap.id = `vid-${id}`;
            
            let video = document.createElement("video");
            video.className = "video-element";
            video.autoplay = true;
            video.playsInline = true;
            video.muted = isLocal;
            video.srcObject = stream;
            
            let nameTag = document.createElement("div");
            nameTag.className = "video-name";
            nameTag.innerText = isLocal ? `${name}(我)` : name;
            
            wrap.appendChild(video);
            wrap.appendChild(nameTag);
            document.getElementById("video-grid").appendChild(wrap);
        }

        // 视频控制：麦克风
        function toggleMic() {
            micOn = !micOn;
            localStream.getAudioTracks()[0].enabled = micOn;
            document.getElementById("mic-btn").innerHTML = micOn ? '<i class="fa fa-microphone"></i>' : '<i class="fa fa-microphone-slash"></i>';
        }

        // 视频控制：摄像头
        function toggleCamera() {
            cameraOn = !cameraOn;
            localStream.getVideoTracks()[0].enabled = cameraOn;
            document.getElementById("camera-btn").innerHTML = cameraOn ? '<i class="fa fa-video-camera"></i>' : '<i class="fa fa-video-camera-slash"></i>';
        }

        // 挂断
        function hangup() {
            if(localStream) localStream.getTracks().forEach(t => t.stop());
            Object.values(callMap).forEach(c => c.close());
            
            callMap = {};
            inCall = false;
            micOn = true;
            cameraOn = true;
            
            document.getElementById("videos").style.display = "none";
            document.getElementById("join-video-btn").style.display = "none";
            document.getElementById("video-grid").innerHTML = "";
            document.getElementById("mic-btn").innerHTML = '<i class="fa fa-microphone"></i>';
            document.getElementById("camera-btn").innerHTML = '<i class="fa fa-video-camera"></i>';
        }

        // 工具函数
        function startVideoUI() {
            document.getElementById("videos").style.display = "block";
            document.getElementById("join-video-btn").style.display = "none";
        }
        function closePopup() { document.getElementById("call-popup").style.display = "none"; }
        function closeAnswer() { document.getElementById("answer-popup").style.display = "none"; }
    </script>
</body>
</html>
