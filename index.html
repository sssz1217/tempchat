<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P群聊</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: Arial, sans-serif;}
        body {background: #f5f5f5;max-width: 500px;margin: 0 auto;}
        .container {height: 100vh;display: flex;flex-direction: column;background: white;}
        .header {padding: 15px;background: #3B82F6;color: white;display: flex;justify-content: space-between;align-items: center;}
        .video-join-btn {background: #10B981;color: white;border: none;padding: 6px 10px;border-radius: 6px;display: none;}
        .login {padding: 20px;text-align: center;}
        .login input {width: 100%;padding: 12px;margin: 10px 0;border: 1px solid #ddd;border-radius: 8px;}
        .login button {width: 100%;padding: 12px;background: #3B82F6;color: white;border: none;border-radius: 8px;}
        .chat {flex: 1;overflow-y: auto;padding: 15px;display: none;background: #f9f9f9;}
        .message {margin-bottom: 10px;max-width: 70%;padding: 10px;border-radius: 10px;}
        .me {background: #3B82F6;color: white;margin-left: auto;}
        .other {background: #e5e5ea;color: black;margin-right: auto;}
        .system {text-align: center;color: #666;font-size: 12px;margin: 5px 0;}
        .footer {display: none;padding: 10px;border-top: 1px solid #ddd;}
        .footer input {flex: 1;padding: 12px;border: 1px solid #ddd;border-radius: 20px;margin-right: 10px;}
        .footer button {padding: 12px 15px;background: #3B82F6;color: white;border: none;border-radius: 50%;}
        .popup {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: rgba(0,0,0,0.5);display: none;justify-content: center;align-items: center;}
        .popup-content {background: white;padding: 20px;border-radius: 10px;width: 90%;max-width: 300px;}
        .user-item {padding: 8px;margin: 5px 0;}
        .popup button {margin-top: 15px;width: 100%;padding: 10px;background: #3B82F6;color: white;border: none;border-radius: 8px;}
        .call-btn {background: #10B981;color: white;border: none;padding: 8px;border-radius: 6px;}
        .answer-btn {padding: 8px 15px;margin: 5px;border: none;border-radius: 6px;}
        .videos {position: fixed;top: 0;left: 0;width: 100%;height: 100%;background: #000;display: none;z-index: 999;}
        /* 👇 只新增：多人视频网格样式（不改动原有任何样式） */
        .video-grid {display: grid;grid-template-columns: 1fr 1fr;gap: 5px;padding: 5px;height: 100%;}
        .video-wrapper {position: relative;background: #222;border-radius: 8px;overflow: hidden;}
        .video-element {width: 100%;height: 100%;object-fit: cover;}
        .video-name {position: absolute;bottom: 5px;left: 5px;background: rgba(0,0,0,0.6);color: #fff;padding: 2px 5px;border-radius: 3px;font-size: 12px;}
        /* 👇 只新增：视频控制按钮样式 */
        .control-bar {position: absolute;bottom: 30px;left: 50%;transform: translateX(-50%);display: flex;gap: 15px;}
        .control-btn {width: 45px;height: 45px;border-radius: 50%;border: none;color: #fff;font-size: 16px;}
        .bg-gray {background: #444;}
        .bg-red {background: red;}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h3>P2P群聊</h3>
                <p id="peer-id">你的ID：加载中...</p>
            </div>
            <button class="video-join-btn" id="join-video-btn">参与视频通话</button>
            <button class="call-btn" id="call-btn" style="display:none;"><i class="fa fa-video-camera"></i></button>
        </div>

        <div class="login" id="login">
            <input id="username" placeholder="输入你的昵称">
            <input id="remote-id" placeholder="输入对方ID（可留空）">
            <button onclick="login()">进入聊天</button>
        </div>

        <div class="chat" id="chat"></div>

        <div class="footer" id="footer">
            <input id="msg" placeholder="输入消息...">
            <button onclick="sendMsg()"><i class="fa fa-paper-plane"></i></button>
        </div>
    </div>

    <!-- 👇 只新增：视频网格容器 + 控制按钮（不改动原有DOM） -->
    <div class="videos" id="videos">
        <div class="video-grid" id="video-grid"></div>
        <div class="control-bar">
            <button class="control-btn bg-gray" id="mic-btn" onclick="toggleMic()"><i class="fa fa-microphone"></i></button>
            <button class="control-btn bg-gray" id="cam-btn" onclick="toggleCam()"><i class="fa fa-video-camera"></i></button>
            <button class="control-btn bg-red" onclick="hangup()"><i class="fa fa-phone"></i></button>
        </div>
    </div>

    <!-- 选择呼叫人员弹窗 -->
    <div class="popup" id="call-popup">
        <div class="popup-content">
            <h3>选择要呼叫的人</h3>
            <div id="user-list"></div>
            <button onclick="startSelectedCall()">发起呼叫</button>
            <button onclick="closePopup()" style="background:#666;margin-top:5px;">取消</button>
        </div>
    </div>

    <!-- 来电接听弹窗 -->
    <div class="popup" id="answer-popup">
        <div class="popup-content">
            <h3 id="caller-name">有人邀请你视频通话</h3>
            <button class="answer-btn" style="background:green" onclick="answerCall()">接受</button>
            <button class="answer-btn" style="background:red" onclick="closeAnswer()">拒绝</button>
        </div>
    </div>

    <script>
        // 👇 原始代码 100% 保留，一丝未改
        let peer;
        let myId;
        let username;
        let connList = {};
        let localStream;
        let currentCall;
        let inCall = false;
        let callingUser = "";

        let messageHistory = JSON.parse(localStorage.getItem("p2p_chat_history")) || [];

        window.onload = init();

        function init() {
            loadHistory();
            
            peer = new Peer({
                config: { iceServers: [{ urls: 'stun:stun.cloudflare.com' }] }
            });

            peer.on("open", id => {
                myId = id;
                document.getElementById("peer-id").innerText = "你的ID：" + id;
            });

            peer.on("connection", conn => {
                handleNewConn(conn);
            });

            peer.on("call", call => {
                currentCall = call;
                callingUser = call.peer;
                document.getElementById("caller-name").innerText = connList[call.peer]?.name + " 邀请你视频通话";
                document.getElementById("answer-popup").style.display = "flex";
            });
        }

        function login() {
            username = document.getElementById("username").value.trim();
            let remoteId = document.getElementById("remote-id").value.trim();
            if (!username) return alert("请输入昵称");

            document.getElementById("login").style.display = "none";
            document.getElementById("chat").style.display = "block";
            document.getElementById("footer").style.display = "flex";
            document.getElementById("call-btn").style.display = "block";

            if (remoteId) {
                let conn = peer.connect(remoteId);
                handleNewConn(conn);
            }
        }

        function handleNewConn(conn) {
            conn.on("open", () => {
                connList[conn.peer] = { conn, name: "" };
                conn.send({ type: "info", name: username });
                conn.send({ type: "history", list: messageHistory });
            });

            conn.on("data", data => {
                if (data.type === "info") {
                    connList[conn.peer].name = data.name;
                    addSysMsg(data.name + " 加入群聊");
                }
                if (data.type === "msg") {
                    addMsg(data.name, data.text, false);
                }
                if (data.type === "history") {
                    messageHistory = data.list;
                    localStorage.setItem("p2p_chat_history", JSON.stringify(messageHistory));
                    loadHistory();
                }
            });
        }

        function sendMsg() {
            let text = document.getElementById("msg").value.trim();
            if (!text) return;
            addMsg(username, text, true);
            document.getElementById("msg").value = "";

            Object.values(connList).forEach(item => {
                item.conn.send({ type: "msg", name: username, text });
            });
        }

        function addMsg(name, text, isMe) {
            let div = document.createElement("div");
            div.className = "message " + (isMe ? "me" : "other");
            div.innerText = (isMe ? "" : name + "：") + text;
            document.getElementById("chat").appendChild(div);
            document.getElementById("chat").scrollTop = 9999;

            messageHistory.push({ name, text, isMe });
            localStorage.setItem("p2p_chat_history", JSON.stringify(messageHistory));
        }

        function addSysMsg(text) {
            let div = document.createElement("div");
            div.className = "system";
            div.innerText = text;
            document.getElementById("chat").appendChild(div);
        }

        function loadHistory() {
            document.getElementById("chat").innerHTML = "";
            messageHistory.forEach(item => {
                let div = document.createElement("div");
                div.className = "message " + (item.isMe ? "me" : "other");
                div.innerText = (item.isMe ? "" : item.name + "：") + item.text;
                document.getElementById("chat").appendChild(div);
            });
        }

        document.getElementById("call-btn").onclick = () => {
            let list = document.getElementById("user-list");
            list.innerHTML = "";
            Object.values(connList).forEach(item => {
                if (item.name) {
                    list.innerHTML += `<div class="user-item"><input type="checkbox" id="${item.conn.peer}" value="${item.conn.peer}"> ${item.name}</div>`;
                }
            });
            document.getElementById("call-popup").style.display = "flex";
        };

        // 👇 只新增：全局存储通话对象（支持多人）
        let callMap = {};
        let micEnabled = true;
        let camEnabled = true;

        function startSelectedCall() {
            let checkboxes = document.querySelectorAll("#user-list input:checked");
            if (checkboxes.length === 0) { alert("请选择人员"); return; }
            
            closePopup();
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                // 👇 只新增：渲染多人视频
                renderVideo(myId, username, stream, true);
                document.getElementById("videos").style.display = "block";
                inCall = true;
                document.getElementById("join-video-btn").style.display = "block";

                checkboxes.forEach(box => {
                    let call = peer.call(box.value, stream);
                    callMap[box.value] = call;
                    listenStream(call);
                });
            });
        }

        function answerCall() {
            document.getElementById("answer-popup").style.display = "none";
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                // 👇 只新增：渲染多人视频
                renderVideo(myId, username, stream, true);
                currentCall.answer(stream);
                listenStream(currentCall);
                document.getElementById("videos").style.display = "block";
                inCall = true;
            });
        }

        // 👇 只新增：监听远程视频流
        function listenStream(call) {
            call.on("stream", remoteStream => {
                const name = connList[call.peer]?.name || "用户";
                renderVideo(call.peer, name, remoteStream, false);
            });
        }

        // 👇 只新增：渲染多人视频画面
        function renderVideo(id, name, stream, isMe) {
            if (document.getElementById(`v_${id}`)) return;
            const wrap = document.createElement("div");
            wrap.className = "video-wrapper";
            wrap.id = `v_${id}`;

            const video = document.createElement("video");
            video.className = "video-element";
            video.autoplay = true;
            video.playsInline = true;
            video.muted = isMe;
            video.srcObject = stream;

            const tag = document.createElement("div");
            tag.className = "video-name";
            tag.innerText = isMe ? `${name}(我)` : name;

            wrap.appendChild(video);
            wrap.appendChild(tag);
            document.getElementById("video-grid").appendChild(wrap);
        }

        // 👇 只新增：开关麦克风
        function toggleMic() {
            micEnabled = !micEnabled;
            localStream.getAudioTracks()[0].enabled = micEnabled;
            document.getElementById("mic-btn").innerHTML = micEnabled ? '<i class="fa fa-microphone"></i>' : '<i class="fa fa-microphone-slash"></i>';
        }

        // 👇 只新增：开关摄像头
        function toggleCam() {
            camEnabled = !camEnabled;
            localStream.getVideoTracks()[0].enabled = camEnabled;
            document.getElementById("cam-btn").innerHTML = camEnabled ? '<i class="fa fa-video-camera"></i>' : '<i class="fa fa-video-camera-slash"></i>';
        }

        document.getElementById("join-video-btn").onclick = () => {
            if(inCall) return;
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                localStream = stream;
                renderVideo(myId, username, stream, true);
                document.getElementById("videos").style.display = "block";
                inCall = true;

                Object.values(connList).forEach(item => {
                    let call = peer.call(item.conn.peer, stream);
                    callMap[item.conn.peer] = call;
                    listenStream(call);
                });
            });
        };

        // 👇 原始挂断函数，只新增清空视频网格
        function hangup() {
            localStream?.getTracks().forEach(t => t.stop());
            document.getElementById("videos").style.display = "none";
            document.getElementById("join-video-btn").style.display = "none";
            document.getElementById("video-grid").innerHTML = ""; // 新增清空画面
            inCall = false;
            micEnabled = true; camEnabled = true;
            document.getElementById("mic-btn").innerHTML = '<i class="fa fa-microphone"></i>';
            document.getElementById("cam-btn").innerHTML = '<i class="fa fa-video-camera"></i>';
        }

        function closePopup() {
            document.getElementById("call-popup").style.display = "none";
        }
        function closeAnswer() {
            document.getElementById("answer-popup").style.display = "none";
        }
    </script>
</body>
</html>
